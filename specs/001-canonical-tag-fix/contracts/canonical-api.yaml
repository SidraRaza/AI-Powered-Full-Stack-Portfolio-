# Canonical Tag API Contract

## Overview
This document defines the API contract for canonical tag generation in the portfolio website.

## Metadata API Endpoint

### GET /api/metadata/{path}

#### Description
Retrieves metadata for a specific page path, including the canonical URL.

#### Parameters
- path (string, required): The page path to retrieve metadata for

#### Response
- 200 OK: Successful response with metadata
  - Content-Type: application/json
  - Body:
    ```json
    {
      "title": "Page Title",
      "description": "Page Description",
      "canonicalUrl": "https://example.com/page-path",
      "createdAt": "2023-01-01T00:00:00Z",
      "updatedAt": "2023-01-01T00:00:00Z"
    }
    ```

#### Example Request
```
GET /api/metadata/about
```

#### Example Response
```
{
  "title": "About - Sidra Raza Portfolio",
  "description": "Learn more about Sidra Raza and her work",
  "canonicalUrl": "https://sidra-raza-portfolio.com/about",
  "createdAt": "2023-01-01T00:00:00Z",
  "updatedAt": "2023-01-01T00:00:00Z"
}
```

## Canonical Tag Validation Endpoint

### POST /api/canonical/validate

#### Description
Validates a canonical URL to ensure it follows SEO best practices.

#### Request Body
```json
{
  "url": "https://example.com/page",
  "currentPage": "/current-page"
}
```

#### Response
- 200 OK: Validation successful
  - Content-Type: application/json
  - Body:
    ```json
    {
      "isValid": true,
      "issues": [],
      "suggestions": []
    }
    ```
- 400 Bad Request: Validation failed
  - Content-Type: application/json
  - Body:
    ```json
    {
      "isValid": false,
      "issues": [
        "Circular reference detected",
        "Invalid URL format"
      ],
      "suggestions": [
        "Use absolute URL",
        "Point to different page"
      ]
    }
    ```