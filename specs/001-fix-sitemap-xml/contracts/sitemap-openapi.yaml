openapi: 3.0.0
info:
  title: Sitemap API
  version: 1.0.0
  description: API for managing and retrieving sitemap information
paths:
  /sitemap.xml:
    get:
      summary: Retrieve the sitemap in XML format
      responses:
        '200':
          description: Successful response with sitemap XML
          content:
            application/xml:
              schema:
                type: string
                example: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n  <url>\n    <loc>https://sidraraza.xyz</loc>\n    <lastmod>2026-02-12</lastmod>\n    <changefreq>yearly</changefreq>\n    <priority>1.0</priority>\n  </url>\n</urlset>"
        '404':
          description: Sitemap not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Sitemap not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
  /api/sitemap-info:
    get:
      summary: Retrieve sitemap information in JSON format
      description: Provides sitemap metadata and statistics
      responses:
        '200':
          description: Successful response with sitemap information
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastGenerated:
                    type: string
                    format: date-time
                    description: Timestamp when the sitemap was last generated
                    example: "2026-02-12T10:00:00Z"
                  totalUrls:
                    type: integer
                    description: Total number of URLs in the sitemap
                    example: 25
                  status:
                    type: string
                    description: Current status of the sitemap
                    enum: [valid, invalid, pending]
                    example: "valid"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"