<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fb7185"/>
      <stop offset="50%" stopColor="#fda4af"/>
      <stop offset="100%" stopColor="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.98 0 0 0 0 0.44 0 0 0 0 0.52 0 0 0 0.4 0"/>
    </filter>
  </defs>

  <!-- Main text with gradient -->
  <text x="10" y="40" fontFamily="system-ui, -apple-system, sans-serif" fontSize="32" fontWeight="700" fill="url(#logoGradient)" filter="url(#glow)">
    Sidra Raza
  </text>

  <!-- Subtle AI/tech element - neural network inspired dots -->
  <g fill="#fb7185" opacity="0.8">
    <circle cx="150" cy="15" r="2.5" />
    <circle cx="162" cy="12" r="2" />
    <circle cx="156" cy="22" r="2" />
    <circle cx="168" cy="18" r="1.5" />
    <circle cx="160" cy="28" r="1.5" />
  </g>
</svg>