<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00f0ff"/>
      <stop offset="100%" stopColor="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.06 0 0 0 0 0.75 0 0 0 0 1 0 0 0 0.2 0"/>
    </filter>
  </defs>

  <!-- Main text with gradient -->
  <text x="10" y="40" fontFamily="system-ui, -apple-system, sans-serif" fontSize="32" fontWeight="600" fill="url(#logoGradient)" filter="url(#glow)">
    Sidra Raza
  </text>

  <!-- Subtle AI/tech element - neural network inspired dots -->
  <g fill="#00f0ff" opacity="0.6">
    <circle cx="150" cy="15" r="2" />
    <circle cx="160" cy="12" r="1.5" />
    <circle cx="155" cy="20" r="1.5" />
    <circle cx="165" cy="18" r="1" />
    <circle cx="158" cy="25" r="1" />
  </g>
</svg>