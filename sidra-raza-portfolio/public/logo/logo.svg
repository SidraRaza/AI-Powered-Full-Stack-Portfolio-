<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Icon Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Text & Mark Gradient -->
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Badge Container -->
  <rect x="5" y="5" width="50" height="50" rx="14" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="1.5"/>

  <!-- SR Monogram Emblem -->
  <g transform="translate(14, 14)">
    <!-- Stylized S & R intertwined geometry -->
    <path d="M7 10C7 7.79086 8.79086 6 11 6H15C17.2091 6 19 7.79086 19 10C19 12.2091 17.2091 14 15 14H10C7.79086 14 6 15.7909 6 18C6 20.2091 7.79086 22 10 22H16C18.2091 22 20 20.2091 20 18" stroke="url(#roseGradient)" stroke-width="3" stroke-linecap="round" filter="url(#roseGlow)"/>
    <circle cx="20" cy="10" r="2" fill="#fb7185"/>
    <circle cx="6" cy="18" r="2" fill="#f472b6"/>
  </g>

  <!-- Brand Name Text -->
  <text x="68" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.02em" fill="url(#roseGradient)" filter="url(#roseGlow)">
    Sidra Raza
  </text>
</svg>