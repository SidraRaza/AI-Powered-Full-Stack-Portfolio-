<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0F172A"/>
  
  <!-- Background Glows -->
  <circle cx="300" cy="200" r="300" fill="#FB7185" fill-opacity="0.15" filter="blur(80px)"/>
  <circle cx="900" cy="450" r="300" fill="#E11D48" fill-opacity="0.15" filter="blur(80px)"/>

  <!-- Outer Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" stroke="#FB7185" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Logo Emblem Box -->
  <rect x="420" y="140" width="80" height="80" rx="20" fill="url(#emblemBg)" stroke="#FB7185" stroke-opacity="0.5" stroke-width="2"/>
  <text x="460" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="url(#roseText)" text-anchor="middle" letter-spacing="-1">SR</text>

  <!-- Name Header -->
  <text x="520" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#roseText)" letter-spacing="-1.5">Sidra Raza</text>

  <!-- Title & Subtitle -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#F8FAFC" text-anchor="middle">Full Stack &amp; Agentic AI Developer</text>
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8" text-anchor="middle">Building Intelligent AI Agents &amp; Automated Business Workflows</text>

  <!-- URL Badge -->
  <rect x="485" y="440" width="230" height="48" rx="24" fill="#FB7185" fill-opacity="0.12" stroke="#FB7185" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="515" cy="464" r="4" fill="#FB7185"/>
  <text x="530" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#FDA4AF">sidraraza.xyz</text>

  <defs>
    <linearGradient id="emblemBg" x1="420" y1="140" x2="500" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="roseText" x1="420" y1="140" x2="800" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="0.5" stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
</svg>
