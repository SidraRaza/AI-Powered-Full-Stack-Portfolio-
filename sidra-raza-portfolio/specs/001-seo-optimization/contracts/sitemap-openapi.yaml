openapi: 3.0.0
info:
  title: Sitemap API for sidraraza.xyz
  description: API for generating and serving sitemap.xml for SEO optimization
  version: 1.0.0
servers:
  - url: https://sidraraza.xyz
    description: Production server
paths:
  /sitemap.xml:
    get:
      summary: Retrieve the website sitemap
      description: Returns the sitemap.xml file containing all website pages for search engine crawling
      responses:
        '200':
          description: Successful response with sitemap.xml content
          content:
            application/xml:
              schema:
                type: string
                description: XML content of the sitemap
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                  <url>
                    <loc>https://sidraraza.xyz/</loc>
                    <lastmod>2026-01-12</lastmod>
                    <changefreq>daily</changefreq>
                    <priority>1.0</priority>
                  </url>
                  <url>
                    <loc>https://sidraraza.xyz/about</loc>
                    <lastmod>2026-01-12</lastmod>
                    <changefreq>weekly</changefreq>
                    <priority>0.9</priority>
                  </url>
                </urlset>
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to generate sitemap"