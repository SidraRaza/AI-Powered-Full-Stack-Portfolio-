openapi: 3.0.0
info:
  title: Robots.txt API for sidraraza.xyz
  description: API for serving robots.txt file for search engine crawling instructions
  version: 1.0.0
servers:
  - url: https://sidraraza.xyz
    description: Production server
paths:
  /robots.txt:
    get:
      summary: Retrieve the robots.txt file
      description: Returns the robots.txt file with crawling instructions for search engines
      responses:
        '200':
          description: Successful response with robots.txt content
          content:
            text/plain:
              schema:
                type: string
                description: Plain text content of the robots.txt file
              example: |
                User-agent: *
                Allow: /

                Sitemap: https://sidraraza.xyz/sitemap.xml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to generate robots.txt"