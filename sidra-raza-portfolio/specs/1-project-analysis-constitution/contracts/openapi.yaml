openapi: 3.0.0
info:
  title: Project Analysis API
  version: 1.0.0
  description: API for analyzing codebases and generating project constitutions
paths:
  /analyze:
    post:
      summary: Analyze a project codebase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectPath:
                  type: string
                  description: Path to the project to analyze
                options:
                  type: object
                  properties:
                    includeSecurity:
                      type: boolean
                      description: Whether to include security analysis
                    includePerformance:
                      type: boolean
                      description: Whether to include performance analysis
                    includeArchitecture:
                      type: boolean
                      description: Whether to include architecture analysis
                    excludePatterns:
                      type: array
                      items:
                        type: string
                      description: Patterns of files to exclude from analysis
      responses:
        '200':
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisReport'
        '400':
          description: Invalid request parameters
        '500':
          description: Internal server error
  /constitution/generate:
    post:
      summary: Generate a project constitution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectPath:
                  type: string
                  description: Path to the project to analyze
                projectName:
                  type: string
                  description: Name of the project
                projectDescription:
                  type: string
                  description: Description of the project
      responses:
        '200':
          description: Constitution generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstitutionDocument'
        '400':
          description: Invalid request parameters
        '500':
          description: Internal server error
  /issues/detect:
    post:
      summary: Detect issues in a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectPath:
                  type: string
                  description: Path to the project to analyze
                categories:
                  type: array
                  items:
                    type: string
                  description: Categories of issues to detect
      responses:
        '200':
          description: Issues detected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                  summary:
                    $ref: '#/components/schemas/ScanSummary'
        '400':
          description: Invalid request parameters
        '500':
          description: Internal server error
components:
  schemas:
    AnalysisReport:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        projectInfo:
          $ref: '#/components/schemas/ProjectInfo'
        scanResults:
          $ref: '#/components/schemas/CodebaseScanResult'
        constitution:
          $ref: '#/components/schemas/ConstitutionDocument'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        executiveSummary:
          type: string
    CodebaseScanResult:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        projectPath:
          type: string
        totalFiles:
          type: number
        fileTypes:
          type: object
          additionalProperties:
            type: number
        totalSize:
          type: number
        scanDuration:
          type: number
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        summary:
          $ref: '#/components/schemas/ScanSummary'
    Issue:
      type: object
      properties:
        id:
          type: string
        ruleId:
          type: string
        severity:
          type: string
          enum: [error, warning, info]
        message:
          type: string
        filePath:
          type: string
        line:
          type: number
        column:
          type: number
        codeSnippet:
          type: string
        category:
          type: string
          enum: [security, quality, performance, architecture, best-practice]
        recommendation:
          type: string
        confidence:
          type: number
    ScanSummary:
      type: object
      properties:
        totalFiles:
          type: number
        analyzedFiles:
          type: number
        skippedFiles:
          type: number
        totalIssues:
          type: number
        criticalIssues:
          type: number
        highSeverityIssues:
          type: number
        mediumSeverityIssues:
          type: number
        lowSeverityIssues:
          type: number
        scanTimeMs:
          type: number
    ConstitutionDocument:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        version:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ConstitutionSection'
        principles:
          type: array
          items:
            $ref: '#/components/schemas/Principle'
        authors:
          type: array
          items:
            type: string
    ConstitutionSection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        order:
          type: number
    Principle:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [development, architecture, security, testing, deployment]
        priority:
          type: string
          enum: [high, medium, low]
    Recommendation:
      type: object
      properties:
        id:
          type: string
        issueId:
          type: string
        title:
          type: string
        description:
          type: string
        implementationSteps:
          type: array
          items:
            type: string
        estimatedEffort:
          type: string
          enum: [minutes, hours, days]
        riskLevel:
          type: string
          enum: [low, medium, high]
        relatedFiles:
          type: array
          items:
            type: string
    ProjectInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        technologies:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
        totalLinesOfCode:
          type: number
    Dependency:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        type:
          type: string
          enum: [production, development]
        isOutdated:
          type: boolean
        securityIssues:
          type: array
          items:
            $ref: '#/components/schemas/SecurityIssue'
        license:
          type: string
    SecurityIssue:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        severity:
          type: string
          enum: [critical, high, moderate, low]
        description:
          type: string
        recommendation:
          type: string
        vulnerableVersions:
          type: array
          items:
            type: string
        patchedVersions:
          type: string